name: Validate and deploy Adventure OS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://zpvmiwnqywachfrpzvyl.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ThlRhoC2N8_JAibOLnd8iA_L8PO-yW1' }}
      NEXT_PUBLIC_BASE_PATH: /travel-plan-central-america
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Gmail background functions
        run: deno check supabase/functions/gmail-connect/index.ts supabase/functions/reservation-jobs/index.ts
      - name: Validate server build
        run: npm run build
      - name: Select installed browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            browser_path=$(command -v google-chrome)
          elif command -v chromium >/dev/null 2>&1; then
            browser_path=$(command -v chromium)
          else
            npx playwright install --with-deps chromium
            browser_path=$(node -p "require('playwright').chromium.executablePath()")
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - name: Test local server workflows
        run: npm run test:e2e
      - name: Build the Pages site
        run: npm run build:pages
      - name: Test static site, authentication and synced workflows
        run: npm run test:pages
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
